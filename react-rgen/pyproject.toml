[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rgen"
version = "1.0.0"
description = "React project generator: Vite + TS + Tailwind + shadcn/ui + React Router + TanStack Query, CRUD features, forms, auth, React Bits"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["react", "vite", "shadcn", "generator", "scaffold", "tanstack-query"]

[project.scripts]
rgen = "rgen.cli:main"

[tool.setuptools]
packages = ["rgen"]
include-package-data = true

[tool.setuptools.package-data]
rgen = ["templates/**/*"]
