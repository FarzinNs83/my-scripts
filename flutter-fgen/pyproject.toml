[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fgen"
version = "2.0.0"
description = "Feature generator for Flutter: Clean / MVVM / Simple x Riverpod / Bloc / Cubit / Provider / GetX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["flutter", "dart", "generator", "clean-architecture", "riverpod", "bloc", "scaffold"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Code Generators",
]

[project.scripts]
fgen = "fgen.cli:main"

[tool.setuptools]
packages = ["fgen"]
include-package-data = true

[tool.setuptools.package-data]
fgen = ["templates/**/*"]
